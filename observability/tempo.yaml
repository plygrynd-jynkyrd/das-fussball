# Minimal single-binary Tempo for local use: receives OTLP over HTTP, stores traces on local disk.
server:
  http_listen_port: 3200   # query API (Grafana connects here)

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318   # apps export traces here

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Enables TraceQL metrics queries (e.g. `{ } | rate()`) used by the Traces dashboard.
metrics_generator:
  processor:
    local_blocks:
      flush_to_storage: true
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks]
